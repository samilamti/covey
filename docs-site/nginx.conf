server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at Traefik, so nginx only sees http. Relative Location headers keep
    # redirects on https instead of bouncing through http first.
    absolute_redirect off;

    # Root redirect to Swedish (canonical language)
    location = / {
        return 301 /sv/;
    }

    # Gzip for old Android browsers
    gzip on;
    gzip_types text/plain text/css application/javascript text/html image/svg+xml;
    gzip_min_length 500;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Cache static assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The donation pages were removed on 2026-08-01 (Covey AB takes no donations).
    # Google kept crawling them as 404s, so send each to its contribute section.
    location ~ "^/ar/ساهم/ماليا/?$" { return 301 /ar/ساهم/; }
    location ~ "^/da/bidrag/okonomisk/?$" { return 301 /da/bidrag/; }
    location ~ "^/en/contribute/financially/?$" { return 301 /en/contribute/; }
    location ~ "^/fi/osallistu/taloudellisesti/?$" { return 301 /fi/osallistu/; }
    location ~ "^/fo/stuðla/fíggjarliga/?$" { return 301 /fo/stuðla/; }
    location ~ "^/is/leggja-til/fjarhagslegur/?$" { return 301 /is/leggja-til/; }
    location ~ "^/kl/peqataanissamut/aningaasaqarnermi/?$" { return 301 /kl/peqataanissamut/; }
    location ~ "^/nb/bidra/okonomisk/?$" { return 301 /nb/bidra/; }
    location ~ "^/pl/wspolpraca/finansowo/?$" { return 301 /pl/wspolpraca/; }
    location ~ "^/se/váikkuhit/ekonomalaččat/?$" { return 301 /se/váikkuhit/; }
    location ~ "^/sv/bidra/ekonomiskt/?$" { return 301 /sv/bidra/; }
    location ~ "^/uk/dopomoha/finansovo/?$" { return 301 /uk/dopomoha/; }

    # Static files — no SPA fallback
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Custom 404
    error_page 404 /sv/404/index.html;
}
