when:
  event: [push, pull_request]

steps:
  - name: backend-test
    image: node:22-alpine
    commands:
      - cd backend && npm ci
      - cd backend && npm test
    environment:
      DATABASE_URL: postgres://test:test@postgres:5432/test
      JWT_SECRET: test-secret-for-ci
      AUTH_PROVIDER: stub
      FEATURE_BANKID_AUTH: "false"
      FEATURE_PUSH_NOTIFICATIONS: "false"
      FEATURE_GEOLOCATION: "false"

  - name: frontend-test
    image: node:22-alpine
    commands:
      - cd frontend && npm ci
      - cd frontend && npm test

  - name: frontend-build
    image: node:22-alpine
    commands:
      - cd frontend && npm ci
      - cd frontend && npm run build

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
