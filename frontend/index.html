<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- Critical for correct scaling on old Android phones -->
    <!-- maximum-scale + user-scalable=no stop WKWebView from auto-zooming toward
         a focused input (and getting stuck zoomed when that input unmounts mid-flow,
         e.g. submitting the create-request form). Safari ignores user-scalable for
         pinch (accessibility), so web users can still zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- PWA-ready -->
    <meta name="theme-color" content="#1e293b" />
    <meta name="description" content="Covey – slipp gå hem ensam. Hitta tryggt sällskap i din närhet." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Covey</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
