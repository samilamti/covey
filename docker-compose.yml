services:
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.docker.network=tillsammans_web"
    networks:
      - web
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://${DOMAIN}
      AUTH_PROVIDER: ${AUTH_PROVIDER}
      FEATURE_BANKID_AUTH: ${FEATURE_BANKID_AUTH:-false}
      FEATURE_PUSH_NOTIFICATIONS: ${FEATURE_PUSH_NOTIFICATIONS:-false}
      FEATURE_GEOLOCATION: ${FEATURE_GEOLOCATION:-false}
      FEATURE_POINTS_SYSTEM: ${FEATURE_POINTS_SYSTEM:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:sentinel@covey.se}
      # Firebase Cloud Messaging (FCM) — used by services/notifications.js to
      # deliver native push to iOS (via APNs) and Android. Value is the full
      # Firebase service-account JSON on a single line. Empty by default so
      # backend tests + local stacks don't require a Firebase project.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.docker.network=tillsammans_web"
      # Required for Socket.io sticky sessions
      - "traefik.http.services.backend.loadbalancer.sticky.cookie=true"
    networks:
      - internal
      - web

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  docs:
    build:
      context: ./docs-site
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=Host(`docs.${DOMAIN}`)"
      - "traefik.http.routers.docs.entrypoints=web"
      - "traefik.docker.network=tillsammans_web"
    networks:
      - web

  webhook:
    build: ./deploy/webhook
    restart: unless-stopped
    # Run as the host user that owns the repo, in the docker socket's group, so
    # git works without "dubious ownership" errors and deploys leave the files
    # owned by that user rather than root.
    user: "${DEPLOY_UID:-1001}:${DOCKER_GID:-988}"
    environment:
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET:-}
      REPO: ${DEPLOY_REPO_DIR:-/home/deploy/apps/tillsammans}
      HOME: /tmp
    # hooks.json and deploy.sh are read from the repo mount, never bind-mounted
    # as single files: a file mount pins the inode, and git replaces files on
    # reset, so the container would keep running the old script.
    command: ["-hooks", "${DEPLOY_REPO_DIR:-/home/deploy/apps/tillsammans}/deploy/webhook/hooks.json", "-template", "-verbose"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path as on the host: compose resolves bind mounts to
      # absolute paths that the host's docker daemon then opens.
      - .:${DEPLOY_REPO_DIR:-/home/deploy/apps/tillsammans}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webhook.rule=Host(`${DOMAIN}`) && Path(`/hooks/deploy`)"
      - "traefik.http.routers.webhook.entrypoints=web"
      - "traefik.http.services.webhook.loadbalancer.server.port=9000"
      - "traefik.docker.network=tillsammans_web"
    networks:
      - web

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

volumes:
  db_data:

networks:
  web:
    external: false
  internal:
    external: false
