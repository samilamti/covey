server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Root redirect to Swedish (canonical language)
    location = / {
        return 302 /sv/;
    }

    # Gzip for old Android browsers
    gzip on;
    gzip_types text/plain text/css application/javascript text/html image/svg+xml;
    gzip_min_length 500;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Cache static assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Static files — no SPA fallback
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Custom 404
    error_page 404 /sv/404/index.html;
}
