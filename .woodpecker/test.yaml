when:
  event: [push, pull_request]

steps:
  - name: backend-test
    image: node:22-alpine
    commands:
      # Every command in a step shares one shell, so cd once: a second
      # "cd backend" would look for backend/backend and fail with exit 2.
      - cd backend
      - npm ci
      - for i in $(seq 1 30); do nc -z postgres 5432 && break; sleep 1; done
      - npm test
    environment:
      DATABASE_URL: postgres://test:test@postgres:5432/test
      JWT_SECRET: test-secret-for-ci
      AUTH_PROVIDER: stub
      FEATURE_BANKID_AUTH: "false"
      FEATURE_PUSH_NOTIFICATIONS: "false"
      FEATURE_GEOLOCATION: "false"

  - name: frontend-test
    image: node:22-alpine
    commands:
      - cd frontend
      - npm ci
      - npm test

  - name: frontend-build
    image: node:22-alpine
    commands:
      - cd frontend
      - npm ci
      - npm run build

  - name: docs-build
    image: node:22-alpine
    commands:
      - cd docs-site
      - npm ci
      - npm run build

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
